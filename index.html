<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiss Lash — Lash &amp; Brow Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--iv:#f8f6f1;--ink:#0d0d0d;--gold:#b08d57;--soft:#6b6b6b;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--iv);color:var(--ink);font-family:'Jost',Arial,sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;font-weight:400}
.logo{width:100%;height:auto;color:currentColor;display:block}
.logo text{font-family:'Playfair Display',Georgia,serif;font-weight:700;fill:currentColor}
/* Intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none}
#intro .p{position:absolute;left:0;right:0;height:50%;background:var(--iv);transition:transform 1.1s var(--ease)}
#intro .t{top:0}#intro .b{bottom:0}
#intro .lg{position:relative;width:min(84vw,560px);animation:pop 3s var(--ease) forwards}
#intro.go .t{transform:translateY(-101%)}#intro.go .b{transform:translateY(101%)}
#intro.go .lg{opacity:0;transform:scale(1.15);transition:all .7s}
#intro.done{display:none}
@keyframes pop{0%{opacity:0;transform:scale(.88);filter:blur(8px)}35%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1)}}
/* Nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;backdrop-filter:blur(14px);background:rgba(248,246,241,.72);border-bottom:1px solid rgba(0,0,0,.06)}
.brand{font-family:'Playfair Display',serif;font-weight:700;letter-spacing:.22em;font-size:15px;color:var(--ink);text-decoration:none}
.links{display:flex;gap:28px;align-items:center}
.links a{color:var(--ink);text-decoration:none;font-size:13px;letter-spacing:.16em;text-transform:uppercase;position:relative}
.links a:not(.btn)::after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--gold);transition:width .4s var(--ease)}
.links a:not(.btn):hover::after{width:100%}
@media(max-width:620px){.links a:not(.btn){display:none}}
/* Buttons */
.btn{position:relative;overflow:hidden;display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--iv)!important;padding:13px 30px;font:400 13px 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:transform .3s var(--ease),background .3s,color .3s}
.btn:hover{transform:translateY(-3px);background:var(--gold);border-color:var(--gold)}
.btn:active{transform:scale(.96)}
.btn.sm{padding:9px 20px;font-size:11px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* Hero */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 6vw 60px;background:radial-gradient(circle at 50% 35%,#fff 0,var(--iv) 60%);position:relative}
.hero .logo{width:min(84vw,520px);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.tag{margin:34px 0 36px;letter-spacing:.35em;font-size:12px;text-transform:uppercase;color:var(--soft)}
.tag span{color:var(--gold);margin:0 .6em}
.scroll{position:absolute;bottom:26px;width:1px;height:54px;background:linear-gradient(var(--ink),transparent);animation:sc 2s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* Sections */
section{padding:100px 6vw}
.wrap{max-width:780px;margin:auto}
.eyebrow{text-align:center;color:var(--gold);letter-spacing:.35em;font-size:11px;text-transform:uppercase}
h2{text-align:center;font-size:clamp(34px,6vw,52px);margin:8px 0 46px;letter-spacing:.03em}
/* Tarifs */
.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:30px}
.tab{background:none;border:1px solid rgba(0,0,0,.2);padding:10px 20px;font:400 12px 'Jost';letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .35s var(--ease);border-radius:40px}
.tab:hover{border-color:var(--ink)}
.tab.on{background:var(--ink);color:var(--iv);border-color:var(--ink)}
.panel{animation:fade .6s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.item{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid rgba(0,0,0,.1);padding:18px 6px;font:inherit;font-size:18px;text-align:left;cursor:pointer;color:var(--ink);transition:padding .4s var(--ease),background .3s}
.item:hover{padding-left:18px;background:rgba(176,141,87,.09)}
.item .n{flex:1}
.item .pr{font-family:'Playfair Display',serif;font-size:22px}
.item .go{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);opacity:0;transform:translateX(-8px);transition:all .4s var(--ease);width:0;overflow:hidden;white-space:nowrap}
.item:hover .go{opacity:1;transform:none;width:78px}
@media(hover:none){.item .go{display:none}}
.hint{text-align:center;color:var(--soft);font-size:13px;margin-top:16px}
/* Règles */
.rules{background:#fff}
details{border-bottom:1px solid rgba(0,0,0,.12)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:22px 4px;font:400 22px 'Playfair Display',serif}
summary::-webkit-details-marker{display:none}
summary i{width:14px;height:14px;position:relative;flex:none}
summary i::before,summary i::after{content:"";position:absolute;background:var(--gold);transition:transform .4s var(--ease)}
summary i::before{left:0;right:0;top:6px;height:1px}
summary i::after{top:0;bottom:0;left:6px;width:1px}
details[open] summary i::after{transform:scaleY(0)}
details .c{padding:0 4px 24px;animation:fade .5s var(--ease)}
details ul{padding-left:18px}details li{margin:6px 0}
.merci{text-align:center;margin-top:34px;letter-spacing:.3em;font-size:12px;text-transform:uppercase;color:var(--soft)}
/* RDV */
.rdv{background:var(--ink);color:var(--iv)}
.rdv h2{color:var(--iv)}
.f{position:relative;margin-bottom:22px}
.f input,.f textarea{width:100%;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.35);color:var(--iv);padding:22px 2px 8px;font:300 17px 'Jost';outline:0;border-radius:0;transition:border-color .3s}
.f textarea{min-height:90px;resize:vertical}
.f label{position:absolute;left:2px;top:22px;color:rgba(255,255,255,.55);pointer-events:none;transition:all .3s var(--ease)}
.f input:focus,.f textarea:focus{border-color:var(--gold)}
.f input:focus+label,.f input:not(:placeholder-shown)+label,.f textarea:focus+label,.f textarea:not(:placeholder-shown)+label{top:0;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:560px){.two{grid-template-columns:1fr;gap:0}}
.lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin:10px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid rgba(255,255,255,.3);background:none;color:var(--iv);padding:9px 16px;border-radius:40px;font:300 14px 'Jost';cursor:pointer;transition:all .3s var(--ease)}
.chip:hover{border-color:var(--gold);transform:translateY(-2px)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink);transform:scale(1.04)}
