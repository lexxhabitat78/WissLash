<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiss Lash</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bk:#0a0a0a;--card:#151413;--ivory:#f6f1e8;--gold:#d8b46a;--gold2:#f3dca0;--ease:cubic-bezier(.2,.9,.25,1.1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Poppins',Arial,sans-serif;color:var(--ivory);background:radial-gradient(circle at 20% 0%,#2a2113 0,var(--bk) 45%),var(--bk);font-weight:300}
.glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;background:var(--gold);animation:fl 12s ease-in-out infinite}
.g1{width:260px;height:260px;top:-70px;right:-60px}
.g2{width:220px;height:220px;bottom:80px;left:-80px;animation-delay:-6s}
@keyframes fl{50%{transform:translate(30px,40px) scale(1.2)}}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif}
.gold{background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200%}}
@keyframes up{to{opacity:1;transform:none}}
/* Intro */
#intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#241c10,#000);transition:opacity .9s,transform .9s,filter .9s;cursor:pointer}
#intro.out{opacity:0;transform:scale(1.25);filter:blur(12px);pointer-events:none}
#intro h1{font-size:clamp(40px,12vw,96px);font-weight:800;letter-spacing:.12em;display:flex;gap:.04em;justify-content:center;flex-wrap:wrap}
#intro h1 span{display:inline-block;opacity:0;transform:translateY(40px) rotate(8deg);animation:up .8s var(--ease) forwards}
#intro h1 .sp{width:.35em}
#intro p{color:var(--gold);letter-spacing:.4em;font-size:12px;text-transform:uppercase;margin-top:14px;opacity:0;transform:translateY(10px);animation:up 1s 1.4s forwards}
/* Structure */
#top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 5vw 12px;backdrop-filter:blur(16px);background:rgba(10,10,10,.65);border-bottom:1px solid rgba(216,180,106,.25)}
.brand{font:800 18px 'Playfair Display',serif;letter-spacing:.2em;cursor:pointer}
.view{position:absolute;inset:0;z-index:5;padding:calc(78px + env(safe-area-inset-top)) 5vw 110px;overflow-y:auto;opacity:0;pointer-events:none;transform:translateX(60px) scale(.97);transition:opacity .5s,transform .6s var(--ease)}
.view.on{opacity:1;pointer-events:auto;transform:none}
.wrap{max-width:900px;margin:auto}
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:6px;background:rgba(18,17,16,.95);border:1px solid rgba(216,180,106,.4);border-radius:40px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#bar button{border:0;background:none;color:var(--ivory);padding:10px 16px;border-radius:30px;font:500 12px 'Poppins';cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .4s var(--ease);opacity:.7}
#bar button b{font-size:18px;font-weight:400;transition:transform .4s var(--ease)}
#bar button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;opacity:1}
#bar button.on b{transform:scale(1.25) rotate(-8deg)}
.btn{position:relative;overflow:hidden;border:0;border-radius:40px;padding:14px 28px;font:600 14px 'Poppins';cursor:pointer;color:#111;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 8px 24px rgba(216,180,106,.3);transition:transform .3s var(--ease),box-shadow .3s}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 12px 30px rgba(216,180,106,.5)}
.btn:active{transform:scale(.94)}
.btn.sec{background:none;color:var(--ivory);border:1px solid var(--gold);box-shadow:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);transform:scale(0);animation:rip .7s forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.spk{position:fixed;z-index:300;pointer-events:none;font-size:16px;animation:spk .8s ease-out forwards}
@keyframes spk{to{transform:translate(var(--x),var(--y)) scale(.2) rotate(180deg);opacity:0}}
/* Photos */
.ph{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,#2a2217,#0d0c0a);display:grid;place-items:center;border:1px solid rgba(216,180,106,.35)}
.ph .art{width:60%;opacity:.9}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.45))}
/* Accueil */
.home{display:grid;gap:30px;align-items:center;justify-items:center;text-align:center}
@media(min-width:820px){.home{grid-template-columns:1fr 1fr;text-align:left;justify-items:start;min-height:70vh}}
.stack{position:relative;width:min(62vw,290px);aspect-ratio:3/4;cursor:pointer;justify-self:center}
.stack
